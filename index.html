<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>헤뤼싀</title>
<meta name="description" content="헤뤼싀 — 아이폰 메시지 화면으로 만나는 나만의 AI 비서실장">

<!-- 홈 화면에 추가했을 때 앱처럼 보이게 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="헤뤼싀">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f9f9f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
<link rel="icon" href="./assets/icons/icon-192.png" sizes="192x192">

<link rel="stylesheet" href="./styles/base.css">
<link rel="stylesheet" href="./styles/list.css">
<link rel="stylesheet" href="./styles/chat.css">

<style>
  /* 스크립트가 뜨기 전 깜빡임 방지 */
  #app { opacity: 0; transition: opacity .2s ease; }
  body.is-ready #app { opacity: 1; }
  #boot-fallback {
    position: fixed; inset: 0; display: none;
    place-content: center; text-align: center;
    padding: 32px; font-size: 15px; line-height: 1.6; color: #8e8e93;
  }
  body.boot-failed #boot-fallback { display: grid; }
  body.boot-failed #app { display: none; }
</style>
</head>
<body>

<div id="app" role="application" aria-label="헤뤼싀 메시지"></div>

<div id="boot-fallback">
  <div>
    <div style="font-size:40px">🪷</div>
    <p><b style="color:#000">헤뤼싀를 열지 못했습니다.</b></p>
    <p>이 앱은 최신 브라우저의 자바스크립트 모듈이 필요합니다.<br>
    사파리·크롬 최신 버전에서 열어 주세요.</p>
  </div>
</div>

<noscript>
  <p style="padding:32px;text-align:center;color:#8e8e93">
    헤뤼싀를 쓰려면 자바스크립트를 켜 주세요.
  </p>
</noscript>

<script type="module" src="./js/app.js"></script>
<script nomodule>document.body.classList.add('boot-failed');</script>
<script>
  window.addEventListener('error', function (e) {
    if (e.target && e.target.tagName === 'SCRIPT') {
      document.body.classList.add('boot-failed');
    }
  }, true);
  // iOS에서 두 손가락 확대/더블탭 확대 막기
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
</script>
</body>
</html>
